/* ============================================================
   NEURAL ARCHITECT PREMIUM++ ENGINE (Inline Version)
   ============================================================ */

class NeuralArchitectEngine {
  constructor(config = {}) {
    this.config = {
      apiKey: config.apiKey || null,
      autoUpdate: config.autoUpdate !== false,
      resourceOptimization: config.resourceOptimization !== false,
      targetFPS: config.targetFPS || 60,
      maxMemoryMB: config.maxMemoryMB || 45,
      enableProfiler: config.enableProfiler !== false
    };
    this.modules = new Map();
    this.eventBus = new EventBus();
    this.isInitialized = false;
    this.version = '1.0.0';
  }

  async init() {
    if (this.isInitialized) return this;
    
    console.log('[NeuralArchitect] Initializing engine v' + this.version);
    
    // Initialize modules
    this.modules.set('eventBus', this.eventBus);
    this.modules.set('apiGateway', new APIGateway({apiKey: this.config.apiKey}, this.eventBus));
    this.modules.set('profiler', new Profiler({enabled: this.config.enableProfiler}, this.eventBus));
    this.modules.set('resources', new ResourceManager({maxMemoryMB: this.config.maxMemoryMB, targetFPS: this.config.targetFPS}, this.eventBus));
    this.modules.set('updater', new UpdateManager({autoUpdate: this.config.autoUpdate}, this.eventBus));
    
    this.isInitialized = true;
    this.eventBus.emit('engine:initialized', { version: this.version });
    
    return this;
  }

  getModule(name) {
    return this.modules.get(name) || null;
  }
}

class EventBus {
  constructor() {
    this.listeners = new Map();
  }
  on(event, callback) {
    if (!this.listeners.has(event)) this.listeners.set(event, []);
    this.listeners.get(event).push(callback);
    return () => this.off(event, callback);
  }
  off(event, callback) {
    const callbacks = this.listeners.get(event);
    if (callbacks) {
      const index = callbacks.indexOf(callback);
      if (index > -1) callbacks.splice(index, 1);
    }
  }
  emit(event, data) {
    const callbacks = this.listeners.get(event);
    if (callbacks) callbacks.forEach(cb => cb(data));
  }
}

class APIGateway {
  constructor(config, eventBus) {
    this.apiKey = config.apiKey;
    this.eventBus = eventBus;
    this.connected = false;
  }
  async authenticate() {
    if (!this.apiKey) return false;
    this.connected = true;
    this.eventBus.emit('api:authenticated', { success: true });
    return true;
  }
}

class Profiler {
  constructor(config, eventBus) {
    this.eventBus = eventBus;
    this.enabled = config.enabled;
    this.fps = 60;
    this.frames = [];
  }
  start() {
    if (!this.enabled) return;
    const now = performance.now();
    this.frames.push(now);
    if (this.frames.length > 60) this.frames.shift();
    if (this.frames.length > 1) {
      const elapsed = this.frames[this.frames.length - 1] - this.frames[0];
      this.fps = Math.round((this.frames.length - 1) / (elapsed / 1000));
    }
  }
  getReport() {
    return { fps: this.fps, targetFPS: 60 };
  }
}

class ResourceManager {
  constructor(config, eventBus) {
    this.eventBus = eventBus;
    this.maxMemoryMB = config.maxMemoryMB || 45;
    this.targetFPS = config.targetFPS || 60;
  }
  getStats() {
    const mem = performance.memory;
    return {
      memory: mem ? Math.round(mem.usedJSHeapSize / 1024 / 1024) : 0,
      maxMemory: this.maxMemoryMB,
      targetFPS: this.targetFPS
    };
  }
}

class UpdateManager {
  constructor(config, eventBus) {
    this.eventBus = eventBus;
    this.autoUpdate = config.autoUpdate;
    this.currentVersion = '1.0.0';
  }
  async checkForUpdates() {
    if (!this.autoUpdate) return;
    // Simulated check
    this.eventBus.emit('update:available', { version: '1.0.1', url: '#' });
  }
}

/* ============================================================
   BACKGROUND PARTICLES
   ============================================================ */
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let bgW, bgH, bgDots = [], bgMx = 0, bgMy = 0;

function initBg(){
  bgW = bgCanvas.width = window.innerWidth;
  bgH = bgCanvas.height = window.innerHeight;
  bgDots = [];
  const count = Math.floor((bgW * bgH) / 8000);
  for(let i=0;i<count;i++){
    bgDots.push({
      x: Math.random()*bgW,
      y: Math.random()*bgH,
      z: Math.random()*2+0.5,
      vx: (Math.random()-0.5)*0.3,
      vy: (Math.random()-0.5)*0.3,
      col: ['rgba(99,102,241','rgba(6,182,212','rgba(245,158,11','rgba(16,185,129','rgba(236,72,153'][Math.floor(Math.random()*5)]
    });
  }
}

function drawBg(){
  bgCtx.clearRect(0,0,bgW,bgH);
  const px=(bgMx-bgW/2)*0.01, py=(bgMy-bgH/2)*0.01;
  for(const d of bgDots){
    d.x+=d.vx+px*d.z*0.06; d.y+=d.vy+py*d.z*0.06;
    if(d.x<0)d.x=bgW; if(d.x>bgW)d.x=0;
    if(d.y<0)d.y=bgH; if(d.y>bgH)d.y=0;
    bgCtx.fillStyle=d.col+(0.15+d.z*0.1)+")";
    bgCtx.beginPath(); bgCtx.arc(d.x,d.y,d.sz*d.z*0.35,0,Math.PI*2); bgCtx.fill();
  }
  bgCtx.lineWidth=0.4;
  for(let a=0;a<bgDots.length;a++){
    for(let b=a+1;b<bgDots.length;b++){
      const dx=bgDots[a].x-bgDots[b].x, dy=bgDots[a].y-bgDots[b].y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<90){
        bgCtx.strokeStyle="rgba(99,102,241,"+(0.06*(1-dist/90))+")";
        bgCtx.beginPath(); bgCtx.moveTo(bgDots[a].x,bgDots[a].y);
        bgCtx.lineTo(bgDots[b].x,bgDots[b].y); bgCtx.stroke();
      }
    }
  }
  requestAnimationFrame(drawBg);
}

initBg();
drawBg();

/* ============================================================
   PANEL TEXTURES
   ============================================================ */
const panelTextures = [];
const panelMeshes = [];
const panelCanvases = []
const pw = 1024, ph = 600;

function createPanelTexture(def){
  const c = document.createElement('canvas');
  c.width = pw; c.height = ph;
  const ctx = c.getContext('2d');
  panelCanvases.push(c);

  function draw(active=false){
    ctx.fillStyle = 'rgba(10,11,16,0.92)';
    ctx.fillRect(0,0,pw,ph);

    ctx.strokeStyle = active ? def.color : 'rgba(255,255,255,0.08)';
    ctx.lineWidth = active ? 4 : 2;
    ctx.strokeRect(8,8,pw-16,ph-16);

    if(active){
      ctx.shadowColor = def.color;
      ctx.shadowBlur = 20;
      ctx.strokeRect(8,8,pw-16,ph-16);
      ctx.shadowBlur = 0;
    }

    ctx.fillStyle = def.color;
    ctx.fillRect(24, 60, pw-48, 2);

    ctx.fillStyle = '#e4e4e7';
    ctx.font = 'bold 36px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(def.label, pw/2, 50);

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '18px Inter, sans-serif';
    ctx.fillText(def.sub, pw/2, 90);

    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '22px Inter, sans-serif';
    const words = def.desc.split(' ');
    let line = '', lines = [];
    for(const w of words){
      if((line+w).length>45){lines.push(line);line=w+' ';}else{line+=w+' '}
    }
    lines.push(line);
    lines.forEach((l,i)=>ctx.fillText(l, pw/2, 150+i*30));

    ctx.fillStyle = def.color2;
    ctx.font = 'bold 16px Inter, sans-serif';
    ctx.textAlign = 'left';
    def.stats.forEach((s,i)=>{
      ctx.fillText(s[0]+':', 60, 350+i*40);
      ctx.fillStyle = '#e4e4e7';
      ctx.fillText(s[1], 200, 350+i*40);
      ctx.fillStyle = def.color2;
    });
  }

  draw(false);
  const tex = new THREE.CanvasTexture(c);
  panelTextures.push(tex);
  return {tex, draw, c};
}

/* ============================================================
   PANEL MESHES
   ============================================================ */
const panelDist = 3;
panelDefs.forEach((def, i) => {
  const {tex, draw, c} = createPanelTexture(def);
  const geo = new THREE.PlaneGeometry(2.4, 1.4);
  const mat = new THREE.MeshBasicMaterial({map:tex, transparent:true, side:THREE.DoubleSide});
  const mesh = new THREE.Mesh(geo, mat);
  
  const angle = (i / panelDefs.length) * Math.PI * 2;
  mesh.position.set(Math.cos(angle)*panelDist, 0, Math.sin(angle)*panelDist);
  mesh.lookAt(0,0,0);
  
  mesh.userData = {def, draw, c, index:i};
  scene.add(mesh);
  panelMeshes.push(mesh);
});

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredPanel = -1;
let activePanelIndex = -1;

function onMouseMove(e){
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
  bgMx = e.clientX; bgMy = e.clientY;
  
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(panelMeshes);
  
  if(hits.length>0){
    const idx = hits[0].object.userData.index;
    if(idx!==hoveredPanel){
      hoveredPanel = idx;
      document.body.style.cursor = 'pointer';
    }
  }else{
    if(hoveredPanel!==-1){
      hoveredPanel = -1;
      document.body.style.cursor = 'default';
    }
  }
}

function onClick(e){
  if(hoveredPanel!==-1 && hoveredPanel!==activePanelIndex){
    activePanelIndex = hoveredPanel;
    
    panelMeshes.forEach((m, i)=>{
      m.userData.draw(i===activePanelIndex);
      m.userData.tex.needsUpdate = true;
    });
    
    engine.eventBus.emit('panel:selected', { 
      panel: panelDefs[activePanelIndex].id 
    });
  }
}

window.addEventListener('mousemove', onMouseMove);
window.addEventListener('click', onClick);

/* ============================================================
   HUD UPDATE
   ============================================================ */
let fpsValue = 60, fpsFrames = 0, fpsTime = 0;

function updateHud(){
  const panelName = activePanelIndex >= 0 ? panelDefs[activePanelIndex].label : 'none';
  document.getElementById('hud-info').textContent = `FPS: ${fpsValue} | Panel: ${panelName} | Mode: 2.5D`;
  
  const mem = performance.memory;
  if(mem){
    const usedMB = Math.round(mem.usedJSHeapSize / 1024 / 1024);
    document.getElementById('memory-status').textContent = `Memory: ${usedMB}MB`;
  }
}

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  controls.update();

  // Core sphere animation
  coreSphere.rotation.x = t * 0.5;
  coreSphere.rotation.y = t * 0.7;
  const pulse = 1 + Math.sin(t * 2) * 0.1;
  coreSphere.scale.set(pulse, pulse, pulse);
  coreInner.rotation.y = -t * 0.3;
  
  // Rings
  ring.rotation.z = t * 0.3;
  ring2.rotation.y = t * 0.2;
  ring2.rotation.x = -Math.PI/4 + Math.sin(t*0.5)*0.1;

  // Inner dots
  innerDots.rotation.y = t * 0.05;
  innerDots.rotation.x = Math.sin(t * 0.1) * 0.1;
  
  // Wireframe glow
  wireMat.opacity = 0.25 + Math.sin(t * 1.5) * 0.1;
  
  // Corner dots
  for(const c of corners){
    const s = 1 + Math.sin(t * 2 + c.position.x) * 0.3;
    c.scale.set(s,s,s);
  }
  
  // FPS tracking
  fpsFrames++;
  const now = performance.now();
  if(now - fpsTime >= 1000){
    fpsValue = fpsFrames;
    fpsFrames = 0;
    fpsTime = now;
    updateHud();
  }
  
  // Highlight hovered panel
  for(let i=0;i<panelMeshes.length;i++){
    const m = panelMeshes[i];
    if(i === hoveredPanel && i !== activePanelIndex){
      m.material.opacity = 0.95;
    } else if(i !== activePanelIndex) {
      m.material.opacity = 0.85;
    }
  }
  
  renderer.render(scene, camera);
}

animate();


/* ============================================================
   RESIZE HANDLER
   ============================================================ */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  initBg();
});

/* ============================================================
   API KEY HANDLER
   ============================================================ */
document.getElementById('connect-btn').addEventListener('click', () => {
  const apiKey = document.getElementById('api-key').value;
  if(apiKey){
    engine.config.apiKey = apiKey;
    const apiGateway = engine.getModule('apiGateway');
    if(apiGateway){
      apiGateway.authenticate().then(success => {
        if(success){
          document.getElementById('engine-status').textContent = 'API: Connected';
          document.getElementById('engine-status').classList.add('connected');
        }
      });
    }
  }
});
  </script>
